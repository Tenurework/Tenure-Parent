<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="tenure-mark-title">
  <title id="tenure-mark-title">Tenure</title>
  <!--
    The Tenure rosette, as the browser-chrome icon.

    NOTE FOR ANYONE EDITING THE PROSE IN THIS FILE: an XML comment may not
    contain two hyphens in a row, so a custom property cannot be spelled out
    here. The first draft of this file did spell one out, the document stopped
    being well-formed XML, and every tab rendered a broken-image glyph while
    every string assertion about the file still passed. That is why
    src/components/md3/Logo.test.tsx now checks the comments as well as the
    paths.

    This is the ONE place in the console that names a colour value, and the
    reason is structural rather than a shortcut: a favicon is fetched and
    rendered as its own document by the browser chrome. There is no page around
    it, so there is no token layer, so asking for the primary colour token on
    its own resolves to nothing and the mark renders as an empty square.

    So the token is still asked for FIRST, in the style block below, and if this
    file is ever inlined into a page it follows the theme like everything else.
    The fallback chain ends at a literal that only a standalone render reaches.

    Two literals, not one, because browser chrome has two backgrounds and a
    single tone cannot be safely legible on both. Neither value is asserted here
    on taste: src/components/md3/Logo.test.tsx recomputes the WCAG 2.2 relative
    luminance of each and fails the build unless the light-chrome tone clears
    3:1 against white, the dark-chrome tone clears 3:1 against black, and both
    sit in the green hue band the Tenure mark belongs to.

    The petal path below is the one guarded by
    tests/architecture/brand-mark-is-one-mark.test.mjs, and Logo.test.tsx
    asserts this file still carries exactly that string, rotated through the
    same six 60 degree positions about the same 16,16 centre. A favicon that
    quietly became a different rosette is the drift nobody sees at 16px.
  -->
  <style>
    /*
     * Scaled to 1.2 rather than the 1.12 the in-page glyph uses. The rosette is
     * a thin-petalled mark and a tab icon is rendered at 16 CSS pixels;
     * measured against the in-app glyph at that size, the extra 7% is the
     * difference between a mark and a speck. The in-app glyph keeps 1.12
     * because it sits in a rail beside other controls and needs the optical
     * padding this does not.
     */
    :root { --tenure-mark-light-chrome: #0b5c3d; --tenure-mark-dark-chrome: #7fd6aa; --tenure-mark: var(--tenure-mark-light-chrome); }
    @media (prefers-color-scheme: dark) { :root { --tenure-mark: var(--tenure-mark-dark-chrome); } }
    .petal { fill: var(--md-sys-color-primary, var(--tenure-mark)); }
  </style>
  <g class="petal" transform="translate(16 16) scale(1.2) translate(-16 -16)">
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(0 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(60 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(120 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(180 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(240 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(300 16 16)"/>
  </g>
</svg>
