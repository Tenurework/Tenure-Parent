<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Tenure">
  <!--
    Tenure favicon — the six-petal rosette knocked out of the "grove" brand
    tile. A filled tile (not an outline) on purpose: at a 16px tab favicon an
    unfilled mark disappears against both light and dark browser chrome, and a
    favicon is a brand asset rather than one of the product's UI icons.
    Geometry is the same PETAL path as src/components/brand/TenureLogo.tsx —
    keep the two in sync.
  -->
  <rect width="32" height="32" rx="7.5" fill="#1c8c5a"/>
  <g transform="translate(16 16) scale(0.86) translate(-16 -16)" fill="#ffffff">
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(60 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(120 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(180 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(240 16 16)"/>
    <path d="M16 16 C 12.4 10.5, 12.4 5.4, 16 3.4 C 19.6 5.4, 19.6 10.5, 16 16 Z" transform="rotate(300 16 16)"/>
  </g>
</svg>
