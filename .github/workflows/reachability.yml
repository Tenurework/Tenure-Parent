name: Reachability probe

# Is the console actually up?
#
# This exists because the machine the operator works from cannot reach
# `*.cloudfront.net` at all — a network policy, not an outage. Every check from
# there returns nothing, and a DNS query for an INVENTED CloudFront name comes
# back identical to a real one, so local evidence cannot tell a live
# distribution from a deleted one. A GitHub runner is on the open internet and
# can.
#
# Read-only: it makes HTTP requests to public hostnames and touches no AWS API,
# so it needs no credentials and cannot change anything.

on:
  workflow_dispatch:

# Nothing. The probe never checks out the repository, never calls the GitHub API
# and never assumes an AWS role — it curls public hostnames and reads a
# certificate. `{}` revokes every scope from GITHUB_TOKEN rather than inheriting
# the repository default, so the token this job carries can do nothing at all if
# a step is ever compromised. Declared explicitly because an inherited default is
# a setting in a web form that no file here would record.
permissions: {}

jobs:
  probe:
    name: Curl the console from outside
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and fetch
        run: |
          for host in helm.tenurework.com d2kj4iy5i37kfd.cloudfront.net d1n6mdis7bs02g.cloudfront.net tenurework.com; do
            echo "=== $host"
            getent hosts "$host" || echo "  (no address)"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://$host/" || echo "000")
            echo "  GET  https://$host/        -> $code"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://$host/signin" || echo "000")
            echo "  GET  https://$host/signin  -> $code"
          done

      - name: Does anything in the AWS account still serve?
        run: |
          # Two managed endpoints that exist only if the account is serving, and
          # neither needs a credential to answer. A suspended account stops
          # serving these; a broken IAM user does not.
          for host in tenure-studio-154932391697.auth.us-east-1.amazoncognito.com                       cognito-idp.us-east-1.amazonaws.com                       sts.amazonaws.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || echo "000")
            echo "  $host -> $code"
          done
          echo "  (a real answer, even 400/403, means the endpoint exists; 000 means nothing is there)"

      - name: The certificate the console presents
        run: |
          echo | openssl s_client -connect helm.tenurework.com:443 -servername helm.tenurework.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "  no TLS answer"
