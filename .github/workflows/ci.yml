name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call: # Allow deploy.yml to call this as a dependency

# One run per ref, and the newest one wins — except on main.
#
# Nothing superseded anything before this: pushing three times in five minutes
# bought three full matrices, and the two doomed ones still held a runner for
# the ~19 minutes Studio - Playwright takes. The group keys on the event as well
# as the ref so a `workflow_call` from deploy.yml is never in the same bucket as
# the `push` that triggered it, which would have the caller cancel its own dep.
#
# `cancel-in-progress` is deliberately FALSE on main and true everywhere else.
# On a branch, an obsolete run is just cost. On main it is not: deploy-studio.yml
# fires on `workflow_run: completed` and gates on `conclusion == 'success'`, so
# cancelling a main CI mid-flight converts it to `cancelled` and the deploy for
# that commit silently skips - which is the exact six-hour-mystery failure mode
# this repository already paid for once.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Lint · Type Check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Explicit rather than inherited. This job needs nothing but the source.
      #
      # It briefly also declared `administration: read`, to let the workflow-
      # permissions check read the repository's own Actions settings. That is a
      # GitHub App permission and NOT a GITHUB_TOKEN scope, so GitHub refused to
      # parse the file and CI stopped existing — a 0-second run with no jobs.
      # `workflow-drift.test.mjs` now fails on an invalid scope for that reason.
      contents: read

    env:
      AUTH_SECRET: ci-build-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      # Okta vars are not set in CI — auth routes are dynamic and not called at build time
      OKTA_CLIENT_ID: ci-placeholder
      OKTA_CLIENT_SECRET: ci-placeholder
      OKTA_ISSUER: https://ci.example.okta.com
      # DATABASE_URL is not needed for prisma generate or next build (lazy connection)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tenure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # setup-node's findLockFile reads only the top level of
          # GITHUB_WORKSPACE and does not recurse. The single workspaces
          # lockfile lives at the root; naming it states which lockfile is
          # authoritative instead of leaving it to discovery.
          cache-dependency-path: package-lock.json

      # Root install — npm workspaces installs apps/web from the root lockfile.
      - name: Install dependencies
        run: npm ci

      # lint / type-check / build go through the root delegating scripts in
      # package.json, which run them with cwd = apps/web.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Addressed to the workspace directly, so the flags reach jest no matter
      # what the root script looks like. The root `test` script delegates with a
      # trailing `--` (see package.json) precisely so `npm test -- --ci` also
      # forwards; without it npm swallows --ci and --passWithNoTests as its own
      # CLI flags and the step still exits 0, having run jest without them.
      - name: Test
        run: npm run test --workspace apps/web -- --ci

      # Monorepo-level tests. These assert properties of the repository rather
      # than of the application — first among them that the production-operations
      # workflows cannot fire from a repository that is not the one owning the
      # production deployment. This repository holds the same AWS credentials as
      # the one that deploys, so that guard is the only thing between a merge to
      # main here and a live ECS rollout. It is asserted, not assumed.
      # GE-011-005. The OIDC trust policies name GitHub environments, and a
      # role whose environment does not exist is a role nothing can assume —
      # a failure that surfaces at deploy time, furthest from the mistake.
      # The static half is in oidc-trust.test.mjs; this is the half that
      # needs the API. Read-only: creating the environment here would mean
      # the check could never fail, which is the same as not having it.
      - name: Declared GitHub environments exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node tools/verify-environments.mjs
      # The absorption tests read the PILOT's tree at the commit their snapshots
      # pin, and that commit is reachable only from `satvikOS/Tenure` — it is not
      # an ancestor of this repository's main. `actions/checkout` clones at depth
      # 1, so without this five tests fail here while passing on any machine that
      # has run `git fetch live`:
      #
      #   apps/web/prisma/schema.prisma is not readable at 47c1128…
      #
      # The alternative was to let them degrade quietly in CI the way
      # `simon-absorption-inventory.test.mjs` already does. That is worse: a test
      # that cannot read its subject and says so in a diagnostic still reports
      # green, and the whole point of these five is to catch a schema drifting
      # from the tree it was absorbed from.
      #
      # The repository is public, so this needs no credential. The shas come out
      # of the committed snapshots rather than being written here, so re-pinning a
      # baseline cannot leave this step fetching the wrong commit. `--depth=1` per
      # sha keeps it to the commits themselves and their trees, which is all the
      # tests read.
      - name: Fetch the pilot commits the absorption tests read
        run: |
          set -euo pipefail
          git remote add live https://github.com/satvikOS/Tenure.git 2>/dev/null || true
          shas=$(node -e '
            const fs = require("fs")
            const out = new Set()
            for (const f of fs.readdirSync("docs/architecture")) {
              if (!f.startsWith("simon-") || !f.endsWith(".json")) continue
              const t = fs.readFileSync("docs/architecture/" + f, "utf8")
              for (const m of t.matchAll(/"(?:pinned_commit|head_commit|source_commit|target_commit)":\s*"([0-9a-f]{40})"/g)) out.add(m[1])
            }
            process.stdout.write([...out].join(" "))
          ')
          echo "pinned commits: $shas"
          for sha in $shas; do
            if git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "  $sha already present"
            elif git fetch --no-tags --depth=1 origin "$sha" 2>/dev/null; then
              # The TARGET sha is one of this repository's own commits, and a
              # depth-1 checkout does not have it either once main has moved on.
              echo "  $sha fetched from origin"
            elif git fetch --no-tags --depth=1 live "$sha" 2>/dev/null; then
              echo "  $sha fetched from live"
            else
              echo "  $sha NOT fetchable from either remote — the test that reads it will say so"
            fi
          done

      - name: Platform tests
        run: npm run test:platform

      - name: Build
        run: npm run build

      # One-shot: writes the live pilot's front-end URLs into the run summary,
      # and ONLY for a commit whose message carries [show-url].
      #
      # A step that printed this on every run would be noise within a day — the
      # URLs do not change, and a summary that always says the same thing stops
      # being read. Gating on the commit message makes it self-limiting: this run
      # shows it because this commit asked for it, and the next one will not
      # unless it asks too. No follow-up commit is needed to turn it back off,
      # which is the failure mode of "add it now, remove it later".
      #
      # The values are read from the repository, not from AWS. This job holds no
      # AWS credentials by design (ADR-0005), and granting some in order to print
      # a hostname would arm the one job that is deliberately unarmed.
      - name: Front-end URL
        if: contains(github.event.head_commit.message, '[show-url]')
        run: |
          {
            echo "## Tenant front end — Simon OSE"
            echo
            echo "| | URL |"
            echo "|---|---|"
            echo "| CloudFront | https://d1n6mdis7bs02g.cloudfront.net |"
            echo "| Custom domain | https://platform.tenurework.com |"
            echo
            echo "This is **tenant #1's system**, not the platform engine."
            echo "It serves Simon OSE and deploys from Tenurework/Tenure."
            echo
            echo "The Tenure platform engine — the System Studio and control plane —"
            echo "has no URL: it has no deployment yet. See docs/decisions/ADR-0005-CANONICAL-MONOREPO.md."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Migration integrity: the schema and the migrations must not diverge ────
  migrations:
    name: Migrations · Drift + Apply + Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenure
          POSTGRES_PASSWORD: tenure
          POSTGRES_DB: tenure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tenure:tenure@localhost:5432/tenure
      SHADOW_DATABASE_URL: postgresql://tenure:tenure@localhost:5432/tenure_shadow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Editing schema.prisma without generating a migration used to be
      # invisible, because the container reshaped the database with `db push`
      # at boot. Now it is a build failure.
      - name: Migrations must reproduce schema.prisma exactly
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE tenure_shadow;'
          npx prisma migrate diff \
            --from-migrations ./apps/web/prisma/migrations \
            --to-schema-datamodel ./apps/web/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code --script > /tmp/drift.sql || {
              echo "::error::apps/web/prisma/migrations does not reproduce apps/web/prisma/schema.prisma."
              echo "Generate a migration for your schema change:"
              echo "  npx prisma migrate dev --name <describe-your-change>"
              echo ""
              echo "--- missing DDL ---"
              cat /tmp/drift.sql
              exit 1
            }
          echo "✅ Migrations reproduce the schema exactly."

      # Proves migrate deploy works from empty, which is the path a new cell,
      # a new tenant database and every preview environment takes.
      #
      # working-directory, not a --schema flag: the Prisma CLI's implicit
      # ./prisma/schema.prisma lookup is exactly what production relies on, so
      # CI keeps exercising it. (npx walks up to the hoisted root node_modules
      # for the binary.)
      - name: Apply migrations to an empty database
        working-directory: apps/web
        run: npx prisma migrate deploy

      # Proves the bootstrap correctly baselines a `db push`-shaped database
      # with no migration ledger — the shape the live pilot is in today.
      #
      # Also runs from apps/web, which mirrors the container (cwd=/app with
      # prisma/ and scripts/ flattened under it) rather than approximating it.
      # The psql lines are cwd-independent.
      - name: Bootstrap must baseline a legacy pre-migrations database
        working-directory: apps/web
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE tenure_legacy;'
          LEGACY="postgresql://tenure:tenure@localhost:5432/tenure_legacy"

          # Build the legacy shape from the BASELINE MIGRATION, not by pushing
          # today's schema and subtracting.
          #
          # `db push` writes today's schema, so the fixture had to be walked
          # back to the baseline afterwards — and the subtraction only removed
          # post-baseline TABLES. Anything a later migration adds to a table the
          # baseline already creates survived, leaving a database in a state no
          # real one can be in: pre-migrations, yet already holding columns and
          # types that only a later migration introduces.
          #
          # GE-040-001 is what found it. `MembershipStatus` and three columns on
          # `InstitutionMembership` were left behind, so `migrate deploy` failed
          # with "type MembershipStatus already exists" and then "column
          # effectiveFrom already exists" — failures that say nothing about the
          # migration and everything about the fixture. Each new migration
          # touching an existing table would have needed this step edited.
          #
          # The baseline migration IS the legacy schema. Applying it produces
          # exactly the shape the live pilot is in, needs no maintenance as
          # migrations accumulate, and cannot drift from what it is simulating.
          # Resolved and counted rather than globbed straight into the argv.
          # `-f a.sql b.sql` does not mean "two files" to psql - the second word
          # is taken as the DATABASE NAME, so a second `*_baseline` directory
          # would not fail here, it would connect somewhere else and apply half
          # the fixture. There is exactly one baseline today and the schema only
          # ever has one; this makes a second one say so.
          BASELINES=(prisma/migrations/*_baseline/migration.sql)
          if [ ${#BASELINES[@]} -ne 1 ] || [ ! -f "${BASELINES[0]}" ]; then
            echo "::error::expected exactly one baseline migration, found ${#BASELINES[@]}: ${BASELINES[*]}"
            exit 1
          fi
          psql "$LEGACY" -v ON_ERROR_STOP=1 -q -f "${BASELINES[0]}"

          # No migration ledger — that absence is what makes it "legacy", and
          # what db-bootstrap.mjs detects in order to baseline rather than
          # replay over live tables.
          psql "$LEGACY" -c 'DROP TABLE IF EXISTS "_prisma_migrations";'

          psql "$LEGACY" -c $'INSERT INTO "Institution" (id,name,slug,domain,"createdAt","updatedAt") VALUES (\'ci_live\',\'CI Live Data\',\'ci-live\',\'ci.test\',NOW(),NOW());'

          DATABASE_URL="$LEGACY" node scripts/db-bootstrap.mjs

          echo "--- the pre-existing row must still be there ---"
          ROWS=$(psql "$LEGACY" -tAc $'SELECT count(*) FROM "Institution" WHERE id = \'ci_live\';')
          [ "$ROWS" = "1" ] || { echo "::error::Bootstrap destroyed pre-existing data."; exit 1; }
          echo "✅ Live data survived the migration baseline."

      # Every step above applies migrations to a database created moments
      # earlier and never populated, so a backfill would run against zero rows
      # and pass vacuously — verification that reads green while proving
      # nothing. This gives the migrations data, and two tenants, to meet.
      #
      # It is deliberately built to grow: once ADR-0004's M2-M4 make the five
      # global uniques tenant-scoped, the fixture's COLLIDE_WITH_TENANT_A flag
      # flips and this step becomes the assertion those migrations exist to
      # satisfy. Standing it up now means the first real backfill arrives with
      # its test already in place rather than needing one written alongside it.
      - name: Migrations must survive a populated, two-tenant database
        working-directory: apps/web
        run: |
          node scripts/seed.mjs
          node scripts/ci-two-tenant-fixture.mjs
          npx prisma migrate deploy
          node scripts/ci-two-tenant-fixture.mjs --verify

      # Proves tenant isolation is actually reached, not merely correct in
      # principle. Runs against the enforcing client on a real database: a
      # filter that is never applied looks identical to one that works in any
      # test that does not touch PostgreSQL.
      #
      # From apps/web: `prisma generate` resolves ./prisma/schema.prisma from
      # cwd, and test:isolation is a workspace script. Run from the monorepo
      # root both halves fail — the first on a missing schema, the second on a
      # missing script.
      - name: Tenant isolation must hold against a real database
        working-directory: apps/web
        run: npx prisma generate && npm run test:isolation

      # GE-020-005. The report a human runs before signing a consolidation
      # migration — six facts this schema stores twice, and how far apart the
      # copies have drifted on the database in front of them.
      #
      # Run here for one reason: an instrument nobody exercises is broken by the
      # time it is needed, and the moment it is needed is the moment before a
      # migration that deletes something. It is read-only and exits 0 whether or
      # not it finds a blocker, so this step reports and does not gate.
      - name: Duplicate-source divergence report
        working-directory: apps/web
        run: node scripts/duplicate-source-report.mjs >> "$GITHUB_STEP_SUMMARY"

  # ── Headless e2e: real Postgres, seeded data, production build ─────────────
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenure
          POSTGRES_PASSWORD: tenure
          POSTGRES_DB: tenure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tenure:tenure@localhost:5432/tenure
      # `next start` runs in production mode, so this server is held to the
      # production environment contract in src/lib/env.ts. Keeping CI inside
      # that contract is deliberate: it means the rules are exercised on every
      # run instead of being discovered at deploy time. These are throwaway
      # values for an ephemeral database, but they are not the placeholders the
      # contract rejects.
      AUTH_SECRET: e2e-not-a-placeholder-2f8c1d9b4a6e7350f1c2
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_LOGIN: "true"
      ALLOW_DEV_LOGIN_IN_PRODUCTION: "true"
      # Set so the suite signs in through the real interim gate rather than the
      # ungated path — e2e/support/auth.ts fills it and fails loudly if the
      # server under test isn't asking for it.
      DEV_LOGIN_PASSPHRASE: e2e-shared-pilot-passphrase
      # Same as production. Under enforcement a tenant-scoped query with no open
      # scope throws rather than logging, so an entry point that loses its
      # wrapper fails a spec here instead of leaking in production.
      TENANCY_ENFORCE: "true"
      NEXTAUTH_URL: http://localhost:3000
      OKTA_CLIENT_ID: ""
      OKTA_CLIENT_SECRET: ""
      OKTA_ISSUER: ""
      IMAGE_TAG: e2e-local
      JOB_SECRET: e2e-not-a-placeholder-job-4b7d2e9a
      # GE-012-001. `next start` runs in production mode, and the app now
      # refuses to construct an AWS client without knowing its region — a
      # default there silently moves objects to a region a tenant's residency
      # did not permit. Production sets this (infrastructure/terraform/ecs.tf);
      # this job is held to the same contract, which is the point of running it
      # in production mode at all.
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same path production takes, so the 27 e2e specs also test the migrations.
      - name: Apply migrations + seed
        working-directory: apps/web
        run: |
          npx prisma migrate deploy
          node scripts/seed.mjs

      # From apps/web so npx resolves the pinned @playwright/test rather than
      # downloading whatever `playwright` is current — a browser/driver version
      # mismatch is the failure mode otherwise.
      - name: Install Playwright browsers
        working-directory: apps/web
        # Bounded, and the bound is the point. On 2026-08-18 this exact
        # step hung from 16:09:36 to 22:08:55 — five hours fifty-nine minutes —
        # and only died because GitHub's default 360-minute job timeout killed
        # it. `--with-deps` shells out to apt-get, which waits forever on a
        # dpkg lock or a debconf prompt rather than failing. The run concluded
        # `cancelled`, which correctly skipped Deploy Studio, so the visible
        # symptom was a mysterious skip six hours after a push.
        #
        # Two independent guards, because they fix different halves:
        #   · noninteractive removes the prompt as a cause outright.
        #   · the timeout bounds the lock case, which no env var can prevent.
        # Ten minutes against an observed 37s is wide enough that a slow mirror
        # is not a false red, and narrow enough that a stuck apt costs minutes.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run e2e suite
        # Scoped to the project that can actually run here. `npm run e2e` runs
        # BOTH projects, and the `visual` one fingerprints
        # mcr.microsoft.com/playwright:v1.61.1-noble and self-skips everywhere
        # else - so every green run has reported "4 skipped, 182 passed" since
        # the visual step was withdrawn. A permanent yellow is a broken smoke
        # alarm: it trains the reader to ignore the one signal that should never
        # be routine. The 4 come back with their baselines, not before.
        run: npm run e2e -- --project=chromium

      # ── The visual matrix — WITHDRAWN until its baselines exist ─────────────
      #
      # TTES-020-004. A "Visual baselines (pinned container)" step stood here
      # and its machinery was right: `npm run e2e` above SKIPS
      # `e2e/visual-baselines.spec.ts` because the spec fingerprints its
      # container (linux, PLAYWRIGHT_BROWSERS_PATH=/ms-playwright, an
      # `/etc/os-release` saying noble) and this runner is not that, so the
      # comparison was run separately in `mcr.microsoft.com/playwright:v1.61.1-noble`
      # — the one image the references belong to — against the server this job
      # already has built, with the health check asserted rather than merely
      # waited on.
      #
      # What it never had is references. `apps/web/e2e/__screenshots__` has never
      # contained a file, so that step failed 4/4 on every run: a comparison
      # against nothing is not a weak test, it is no test, and it was the only
      # red in this workflow. It is withdrawn here rather than made to pass,
      # because the two ways to make it pass — skipping when the directory is
      # empty, or letting CI write its own baselines — both produce a screenshot
      # suite that cannot fail.
      #
      # The step's body is unchanged in history at `6038a62` and goes back
      # verbatim. The one thing standing between here and there is a set of PNGs
      # captured on Linux, and `.github/workflows/visual-baselines-refresh.yml`
      # is the button that produces them: same image, same project, same server,
      # plus `--update-snapshots`, uploading `apps/web/e2e/__screenshots__/` as
      # an artifact for a human to review and commit. Restore this step in the
      # same change that lands the images.

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # upload-artifact is a `uses:` step, so it never honours
          # working-directory — this path is always workspace-relative, and
          # Playwright writes traces beside its config, at apps/web/.
          path: apps/web/test-results/
          retention-days: 7

  # ── The System Studio, driven headless ─────────────────────────────────────
  #
  # Nothing ran this suite. Thirty-nine tests — the operator gate, the layout
  # geometry, the platform console — existed and were never executed by any
  # workflow, so a locator that had gone stale sat red indefinitely and said
  # nothing about it. A suite nobody runs is documentation with a test-runner
  # API.
  #
  # No AWS credentials, deliberately: the registry degrades when DYNAMODB_TABLE
  # is unset, and pointing CI at a real tenant table would mean reading
  # customer configuration to check a heading.
  studio-e2e:
    name: Studio · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      # DynamoDB Local, not a mock. The registry's access patterns — a
      # conditional write that claims a slug, a Query across one partition, a
      # Scan filtered to STATE rows — are properties of DynamoDB, and a fake
      # would agree with whatever the code did.
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8000:8000"]

    env:
      # Throwaway values for an ephemeral instance, but not the placeholders
      # the environment contract rejects.
      # STUDIO-020-005 — `email:role`, one of the nine operator families. An
      # entry with no role is REFUSED rather than defaulted to an administrator,
      # so the bare address this used to carry would render "Not configured".
      # Five families, because the role-separation spec proves a surface differs:
      # the Auditor may read the fleet and holds no mutating control at all, the
      # Cloud Platform Engineer holds them, and only FinOps/Auditor/Super Admin
      # may read what the fleet costs.
      PLATFORM_OPERATORS: operator@tenure.example:platform-super-admin,auditor@tenure.example:auditor-read-only,cloud@tenure.example:cloud-platform-engineer,finops@tenure.example:finops-analyst,support@tenure.example:support-engineer
      PLATFORM_OPERATOR_SECRET: ci-studio-not-a-placeholder-4c8e2f
      AUTH_SECRET: ci-studio-auth-not-a-placeholder-71bd93
      AUTH_TRUST_HOST: "true"
      STUDIO_AUTH_MODE: credentials
      NEXTAUTH_URL: http://localhost:3100
      PORT: "3100"
      TENANT_TABLE: tenure-tenants-ci
      # Dummy, but AWS-SHAPED. DynamoDB Local does not accept "any credentials
      # and ignore them", which is what the first version of this comment said
      # and what the value chosen to express it then proved false: an access key
      # containing hyphens is refused with UnrecognizedClientException, which
      # reads exactly like a request that reached the real service. It does not
      # check that the key is real; it does check that it looks like one.
      AWS_REGION: us-east-1
      # GE-010-007 / STUDIO-000-006. `lib/cells.ts` no longer defaults the
      # estate: the account, region and partition come from the environment,
      # then from sts:GetCallerIdentity, and then from nowhere — `fleet()`
      # refuses rather than placing a tenant in us-east-1 because a variable was
      # unset. This job's credentials are DynamoDB-Local shaped and cannot reach
      # STS, so the two facts STS would have supplied are supplied here. Both are
      # deliberately NOT the pilot's real values; nothing in this job talks to a
      # real account.
      AWS_ACCOUNT_ID: "000000000000"
      AWS_PARTITION: aws
      AWS_ACCESS_KEY_ID: AKIALOCALDYNAMODBXX
      AWS_SECRET_ACCESS_KEY: localdynamodbsecretnotreal
      AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        # Bounded, and the bound is the point. On 2026-08-18 this exact
        # step hung from 16:09:36 to 22:08:55 — five hours fifty-nine minutes —
        # and only died because GitHub's default 360-minute job timeout killed
        # it. `--with-deps` shells out to apt-get, which waits forever on a
        # dpkg lock or a debconf prompt rather than failing. The run concluded
        # `cancelled`, which correctly skipped Deploy Studio, so the visible
        # symptom was a mysterious skip six hours after a push.
        #
        # Two independent guards, because they fix different halves:
        #   · noninteractive removes the prompt as a cause outright.
        #   · the timeout bounds the lock case, which no env var can prevent.
        # Ten minutes against an observed 37s is wide enough that a slow mirror
        # is not a false red, and narrow enough that a stuck apt costs minutes.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      # No `aws` CLI here, deliberately. production-workflows-disarmed decides
      # a workflow can reach production by looking at what it does, and it
      # cannot tell `--endpoint-url http://localhost:8000` from a real account.
      # A guard that tried to would be a guard with an exception in it, so the
      # table is created through the SDK instead — which additionally refuses
      # to run without an explicit endpoint.
      - name: Create the registry table
        run: |
          for i in $(seq 1 30); do
            if node tools/create-registry-table.mjs; then exit 0; fi
            sleep 1
          done
          echo "::error::DynamoDB Local never answered"
          exit 1

      # STUDIO-100-001 / 100-002 / 030-004 / 130-002. Three specs assert
      # properties of the DATA LAYOUT — a tenant with no DEPLOYMENT sort key is
      # `never deployed`, a tenant placed in a region this control plane holds
      # no credentials for is left out of the export, and a second page of the
      # fleet is not the first. None of those can be written against an empty
      # table, and none of them is skippable: `TENANT_TABLE` is set in this job,
      # so `test.skip(!configured)` does not fire and the specs run against
      # whatever is there. Without this step that is nothing, and they fail.
      #
      # The seeder writes the same item shapes `registry.ts` writes, and refuses
      # to run without an explicit endpoint — so it cannot reach a real account
      # by resolving a region.
      - name: Seed the fleet the Studio e2e reads
        run: node tools/dev/seed-studio-fleet.mjs

      - name: Build the Studio
        run: npm run studio:build

      - name: Start the Studio
        run: |
          npm run start --workspace apps/system-studio &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3100/signin; then
              echo "studio answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the Studio never answered on :3100"
          exit 1

      - name: Playwright
        working-directory: apps/system-studio
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3100
        run: npx playwright test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-playwright-traces
          # `uses:` steps never honour working-directory, so this stays
          # workspace-relative.
          path: apps/system-studio/test-results/
          retention-days: 7
  # ── The container image, built and inspected before anything deploys ───────
  #
  # Nothing used to build this image except a deploy. The Dockerfile was
  # therefore only ever validated by shipping it, and a mistake in it surfaced
  # as a failed production rollout. That was tolerable while the Dockerfile was
  # stable; it stopped being tolerable when the monorepo move rewrote it.
  #
  # Build only — no push. deploy.yml still builds and pushes the image it ships.
  container:
    name: Container · Build + Inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Context is the repo root, matching deploy.yml, because the Dockerfile
      # needs the root lockfile and .npmrc as well as apps/web.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: tenure:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds can still produce an image that cannot serve. Each
      # of these is a failure that would otherwise only appear as an ECS task
      # dying in a rollback loop.
      - name: The image must contain what the entrypoint expects
        run: |
          fail() { echo "::error::$1"; exit 1; }

          echo "--- server bundle at the path entrypoint.sh execs ---"
          docker run --rm --entrypoint sh tenure:ci -c 'test -f /app/apps/web/server.js' \
            || fail "No server.js at /app/apps/web/server.js — entrypoint.sh would exit 'Cannot find module'."

          echo "--- static assets and public/ ---"
          docker run --rm --entrypoint sh tenure:ci -c 'test -d /app/apps/web/.next/static' \
            || fail "Missing .next/static — every page would load unstyled."
          docker run --rm --entrypoint sh tenure:ci -c 'test -d /app/apps/web/public' \
            || fail "Missing public/."

          echo "--- prisma schema + migrations, flattened to /app ---"
          docker run --rm --entrypoint sh tenure:ci -c 'test -f /app/prisma/schema.prisma' \
            || fail "Missing /app/prisma/schema.prisma — db-bootstrap.mjs resolves it from cwd."
          docker run --rm --entrypoint sh tenure:ci -c 'test -d /app/prisma/migrations' \
            || fail "Missing /app/prisma/migrations — migrate deploy would find nothing to apply."
          docker run --rm --entrypoint sh tenure:ci -c 'test -f /app/scripts/db-bootstrap.mjs' \
            || fail "Missing /app/scripts/db-bootstrap.mjs."
          docker run --rm --entrypoint sh tenure:ci -c 'test -f /app/prisma-cli/node_modules/prisma/build/index.js' \
            || fail "Missing the bundled Prisma CLI — the bootstrap falls back to npx, which is absent."

          # The one a Windows checkout silently breaks: if apps/web/node_modules
          # leaks into the build context, it overwrites the musl engine with a
          # Windows .dll.node and the container cannot reach the database.
          echo "--- Prisma query engine must be the musl build ---"
          docker run --rm --entrypoint sh tenure:ci \
            -c 'ls node_modules/.prisma/client/ 2>/dev/null | grep -q "libquery_engine-linux-musl" || ls apps/web/node_modules/.prisma/client/ 2>/dev/null | grep -q "libquery_engine-linux-musl"' \
            || fail "No linux-musl query engine in the image — Windows/glibc engine leaked in via the build context."

          echo "--- no Windows artefacts anywhere ---"
          docker run --rm --entrypoint sh tenure:ci -c '! find / -name "*.dll.node" -not -path "*/proc/*" 2>/dev/null | grep -q .' \
            || fail "A Windows native module is present in the image."

          echo "✅ Image contains everything the entrypoint needs."

      # The entrypoint is fail-closed on migrations, so booting it without a
      # database proves it refuses rather than serving an unverified schema.
      # Bounded twice over: a step timeout so a hang cannot consume a six-hour
      # runner, and `timeout` on the container so the step reports the hang as a
      # failure with output rather than being killed silently. The bootstrap
      # retries a connection ~10 times with backoff, so this takes ~2 minutes.
      - name: The entrypoint must fail closed without a database
        timeout-minutes: 8
        run: |
          set +e
          OUT=$(timeout 300 docker run --rm \
                  -e DATABASE_URL="postgresql://nobody:nobody@127.0.0.1:1/none" \
                  -e SKIP_DB_BOOTSTRAP=false tenure:ci 2>&1)
          CODE=$?
          set -e
          echo "$OUT" | tail -25
          if [ "$CODE" -eq 124 ]; then
            echo "::error::The bootstrap hung against an unreachable database instead of giving up."
            exit 1
          fi
          [ "$CODE" -ne 0 ] || { echo "::error::Container started despite an unreachable database."; exit 1; }
          echo "✅ Refused to serve without a verified schema (exit $CODE)."

  terraform:
    name: Terraform · Format + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Every stack in the repository, on every push, with NO AWS credentials.
    #
    # `terraform validate` catches what a reviewer cannot reliably catch by
    # reading: an undeclared variable, a wrong attribute name, a type mismatch,
    # a reference to a resource that does not exist. Those are apply-time
    # failures, and an apply-time failure in an IaC change is a half-applied
    # stack.
    #
    # `-backend=false` is what makes this credential-free: it initialises
    # providers and skips the S3 backend entirely, so this job cannot read or
    # write state and needs no secret. That is also why it is in CI rather than
    # in platform-plan.yml — a check that needs credentials cannot run on every
    # push, and this one should.
    #
    # It does NOT replace `terraform plan`. Validate proves the configuration is
    # coherent; only a plan against real state proves what it would do.
    strategy:
      fail-fast: false
      matrix:
        stack:
          - infrastructure/terraform   # the pilot
          - infrastructure/studio      # the System Studio
          - infrastructure/oidc        # GitHub Actions deployment identity

    defaults:
      run:
        working-directory: ${{ matrix.stack }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper rewrites stdout and breaks `set -e` semantics in later
          # steps; nothing here needs its outputs.
          terraform_wrapper: false

      - name: Format
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "::error::${{ matrix.stack }} is not formatted. Run: terraform fmt -recursive"
            exit 1
          fi

      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color
