name: Deploy Studio

# The Tenure System Studio — the global platform engine.
#
# This workflow IS armed here, and that is not a hole in the disarm rule; it is
# the rule stated properly. The rule was never "this repository may not deploy".
# It is: **a repository may only deploy what it owns.**
#
#   Tenurework/Tenure         owns the pilot        -> deploy.yml is armed there
#   Tenurework/Tenure-Parent  owns the engine       -> this is armed here
#
# The two stacks share an AWS account and nothing else. In particular they use
# SEPARATE Terraform state (`studio/terraform.tfstate`, not
# `pilot/terraform.tfstate`), because two repositories applying different code
# against one state file means whichever runs second destroys the other's
# resources — which would take the live pilot down.

# Deploys only what CI has passed.
#
# This used to trigger on `push` to main, independently of CI, and the two ran
# side by side. The consequence is visible in the run history and is not
# theoretical: `Deploy Studio success` sits beside `CI failure` on commit after
# commit — 8c1161d, 4e3d1cf, 5561de0, a957b39 — so the engine an operator uses
# was rolled from builds whose own test suite was red. On 5561de0 the red was a
# Studio Playwright job reporting text drawn on top of other text at four
# breakpoints, and it shipped.
#
# `workflow_run` is what fixes it: this fires when CI COMPLETES, and the job
# below refuses to run unless it concluded `success`.
#
# Two consequences worth stating, because both were deliberate trades:
#
#   · The `paths:` filter is gone — `workflow_run` does not support one. So a
#     commit touching only documentation now also reaches this workflow. It is
#     not a wasted deploy in any meaningful sense: the image tag is the commit
#     sha, Terraform is idempotent, and an apply with nothing to change is a
#     no-op that costs a few minutes. Paying that to stop shipping red is the
#     right side of the trade.
#   · `github.sha` is NOT the commit CI tested. Under `workflow_run` it is the
#     default branch's head when the event fired, which drifts the moment two
#     pushes land close together. Every step below therefore uses
#     `github.event.workflow_run.head_sha`, so what deploys is exactly what
#     passed. Getting this wrong would deploy an untested commit while reporting
#     a green one, which is worse than the problem being fixed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, apply, and report the URL
    runs-on: ubuntu-latest

    # Armed for the repository that OWNS the engine, and only for a build that
    # PASSED.
    #
    # Both clauses are load-bearing and they guard different things. The
    # repository check makes this inert in a fork or a mirror. The conclusion
    # check is the one this workflow was missing: without it, a red CI and a
    # successful deploy ran side by side, which is how the console was rolled
    # from builds their own suite had failed.
    #
    # `workflow_dispatch` stays deployable — a manual run has no `workflow_run`
    # payload, and an operator invoking this by hand is making the decision the
    # gate exists to make automatically. A green CI is the default path; a human
    # override is a human's to own.
    if: >-
      github.repository == 'Tenurework/Tenure-Parent' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_DIR: infrastructure/studio
      # The commit CI VERIFIED, not the branch head at trigger time. Under
      # `workflow_run` those differ whenever two pushes land close together, and
      # tagging the image with the wrong one would deploy an untested commit
      # while the run reported a green one. `workflow_dispatch` has no
      # `workflow_run` payload, so it falls back to the ref it was invoked on.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Pinned to the verified commit. `actions/checkout` defaults to the branch
      # head, and under `workflow_run` that is not necessarily what CI ran
      # against — so the default would build a tree nobody tested and tag it
      # with the sha of one that was.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Say what is being deployed, and what passed it
        run: |
          echo "deploying    ${DEPLOY_SHA}"
          echo "checked out  $(git rev-parse HEAD)"
          echo "trigger      ${{ github.event_name }}"
          echo "CI verdict   ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"
          # The whole point of the gate is that these two agree. If they ever do
          # not, the deploy is of an untested tree and must stop here rather
          # than roll and be discovered afterwards.
          if [ "$(git rev-parse HEAD)" != "${DEPLOY_SHA}" ]; then
            echo "::error::checked out $(git rev-parse HEAD) but this run is for ${DEPLOY_SHA}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.SECRETACCESSKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Locate the Terraform state backend
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="tenure-tfstate-${ACCOUNT_ID}-${AWS_REGION}"

          # The bucket is created and owned by the pilot's deploy. If it is not
          # there, something is wrong that this workflow should not paper over
          # by creating infrastructure the other stack expects to own.
          aws s3api head-bucket --bucket "$STATE_BUCKET" \
            || { echo "::error::State bucket $STATE_BUCKET does not exist."; exit 1; }

          echo "STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"
          echo "ACCOUNT_ID=$ACCOUNT_ID"     >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=studio/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=tenure-terraform-locks" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # ECR first: the image has to have somewhere to go before it is built.
      - name: Terraform apply — ECR only
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -target=aws_ecr_repository.studio \
            -var="image_tag=$IMAGE_TAG" \
            -var="platform_operators=${{ secrets.PLATFORM_OPERATORS }}" \
            -var="platform_operator_secret=${{ secrets.PLATFORM_OPERATOR_SECRET }}" \
            -var="platform_reconcile_secret=${{ secrets.PLATFORM_RECONCILE_SECRET }}" \
            -var="cell_reconcile_url=https://d1n6mdis7bs02g.cloudfront.net/api/platform/reconcile" \
            -auto-approve -input=false
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # Root context: the app imports workspace packages that live outside
          # apps/system-studio and resolve through the root lockfile.
          context: .
          file: apps/system-studio/Dockerfile
          push: true
          tags: ${{ env.ECR_URL }}:${{ env.IMAGE_TAG }},${{ env.ECR_URL }}:latest
          build-args: |
            DEPLOYMENT_ID=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply \
            -var="image_tag=$IMAGE_TAG" \
            -var="platform_operators=${{ secrets.PLATFORM_OPERATORS }}" \
            -var="platform_operator_secret=${{ secrets.PLATFORM_OPERATOR_SECRET }}" \
            -var="platform_reconcile_secret=${{ secrets.PLATFORM_RECONCILE_SECRET }}" \
            -var="cell_reconcile_url=https://d1n6mdis7bs02g.cloudfront.net/api/platform/reconcile" \
            -auto-approve -input=false

          {
            echo "STUDIO_URL=$(terraform output -raw studio_url)"
            echo "ECS_CLUSTER=$(terraform output -raw ecs_cluster)"
            echo "ECS_SERVICE=$(terraform output -raw ecs_service)"
          } >> "$GITHUB_ENV"

      - name: Wait for the service to stabilise
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].{desired:desiredCount,running:runningCount,status:status}' --output table

      # A URL that 200s is the only evidence that any of the above worked.
      - name: Prove it serves
        run: |
          set -euo pipefail
          echo "Checking $STUDIO_URL/signin"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STUDIO_URL/signin" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "✅ $STUDIO_URL/signin -> 200"
              echo "SERVING=yes" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "  attempt $i: $CODE — CloudFront takes a few minutes to propagate"
            sleep 20
          done
          echo "::warning::$STUDIO_URL/signin did not return 200 within 10 minutes. The distribution may still be deploying."
          echo "SERVING=no" >> "$GITHUB_ENV"

      - name: The URL
        if: always()
        run: |
          {
            echo "# Tenure System Studio"
            echo
            echo "The **global platform engine** — not a tenant."
            echo
            echo "## ${STUDIO_URL:-not deployed}"
            echo
            if [ "${SERVING:-no}" = "yes" ]; then
              echo "Serving. Sign in at ${STUDIO_URL}/signin"
            else
              echo "Deployed, but not yet answering. CloudFront can take several minutes on first creation."
            fi
            echo
            echo "### Signing in"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Provider | AWS Cognito hosted UI |"
            echo "| Operator identity | an email listed in \`PLATFORM_OPERATORS\` |"
            echo
            echo "The Studio no longer accepts the shared-secret login in production. Terraform creates the Cognito user pool and app client, passes the generated client secret through Secrets Manager, and seeds the listed operator emails into the pool."
            echo
            echo "Authority still comes from \`PLATFORM_OPERATORS\`, not Cognito groups or email domains. A Cognito-authenticated address that is not on the allowlist is refused with the same generic sign-in failure."
            echo
            echo "---"
            echo
            echo "Tenant systems are elsewhere: the Simon OSE pilot is at https://d1n6mdis7bs02g.cloudfront.net and deploys from \`Tenurework/Tenure\`. This engine and that tenant share an AWS account and nothing else — separate Terraform state, separate cluster, separate load balancer, separate distribution."
          } >> "$GITHUB_STEP_SUMMARY"
