name: Debug Logs

# Manual utility: dump the Studio ECS service events, stopped-task reasons and
# app logs so server-side route failures can be diagnosed from Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    # Armed only where the Studio is owned. This job is read-only and uses the
    # same OIDC read role as the inventory workflow, so it can inspect failures
    # without either mutating AWS or consuming the legacy deployment keys.
    if: github.repository == 'Tenurework/Tenure-Parent'

    name: Dump Studio ECS + app logs
    runs-on: ubuntu-latest
    environment: aws-read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_READ_ROLE_ARN }}
          role-session-name: debug-studio-logs-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Locate Studio service
        run: |
          set -euo pipefail
          mask() { sed -E 's/[0-9]{12}/************/g'; }

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          CLUSTER=$(aws ecs list-clusters \
            --query 'clusterArns[?contains(@, `tenure-studio`)] | [0]' \
            --output text)

          if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
            # Names the region as well as the role. `ecs:ListClusters` is
            # regional, so a Studio deployed outside $AWS_REGION is invisible
            # here for a reason that has nothing to do with permissions — and
            # an error that blames only the role sends the operator to IAM.
            echo "::error::No ECS cluster containing tenure-studio was visible to the read role in ${AWS_REGION}. Either the role cannot list clusters, or the Studio is not in this region — set the AWS_REGION secret to the region it is deployed in."
            exit 1
          fi

          SERVICE=$(aws ecs list-services --cluster "$CLUSTER" \
            --query 'serviceArns[?contains(@, `tenure-studio`)] | [0]' \
            --output text)

          if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
            echo "::error::No ECS service containing tenure-studio was visible in the Studio cluster."
            exit 1
          fi

          LOG_GROUP="/ecs/tenure-studio"

          {
            echo "ACCOUNT=$ACCOUNT"
            echo "CLUSTER=$CLUSTER"
            echo "SERVICE=$SERVICE"
            echo "LOG_GROUP=$LOG_GROUP"
          } >> "$GITHUB_ENV"

          echo "Studio target:"
          printf 'cluster=%s\nservice=%s\nlogGroup=%s\n' "$CLUSTER" "$SERVICE" "$LOG_GROUP" | mask

      - name: Service state + deployment events
        run: |
          set -euo pipefail
          mask() { sed -E 's/[0-9]{12}/************/g'; }

          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].{taskDef:taskDefinition,desired:desiredCount,running:runningCount,pending:pendingCount,status:status}' \
            --output table | mask
          echo "=== Deployments ==="
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].deployments[].{status:status,taskDef:taskDefinition,desired:desiredCount,running:runningCount,failed:failedTasks,state:rolloutState,reason:rolloutStateReason}' \
            --output table | mask
          echo "=== Events (newest first) ==="
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].events[:25].[createdAt,message]' --output text | mask

      - name: All stopped tasks with task-def revisions
        run: |
          set -euo pipefail
          mask() { sed -E 's/[0-9]{12}/************/g'; }

          TASKS=$(aws ecs list-tasks --cluster "$CLUSTER" \
            --desired-status STOPPED --query 'taskArns' --output text)
          if [ -n "$TASKS" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks $TASKS \
              --query 'tasks[].{stopped:stoppedAt,taskDef:taskDefinitionArn,reason:stoppedReason,exit:containers[0].exitCode,creason:containers[0].reason}' \
              --output json | mask
          else
            echo "No stopped tasks"
          fi

      - name: Running tasks with revisions and health
        run: |
          set -euo pipefail
          mask() { sed -E 's/[0-9]{12}/************/g'; }

          TASKS=$(aws ecs list-tasks --cluster "$CLUSTER" --query 'taskArns' --output text)

          # STUDIO-000-007. "none" is a claim, and it must only be printed when
          # the call answered. The previous form was
          # `[ -n "$TASKS" ] && aws ecs describe-tasks … || echo none`, in which a
          # refused or failed describe-tasks fell through to `echo none` — an
          # operator diagnosing an outage read "no running tasks" when the truth
          # was that we were not allowed to look.
          if [ -z "$TASKS" ]; then
            echo "none — the cluster reported no tasks"
          elif DESCRIBED=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks $TASKS \
              --query 'tasks[].{def:taskDefinitionArn,status:lastStatus,health:healthStatus,started:startedAt}' \
              --output json 2>&1); then
            printf '%s\n' "$DESCRIBED" | mask
          else
            echo "::warning::unknown — ecs:DescribeTasks did not answer. This is NOT 'no running tasks'."
            printf '%s\n' "$DESCRIBED" | mask
          fi

      - name: Newest log streams and their tails
        run: |
          set -euo pipefail
          mask() { sed -E 's/[0-9]{12}/************/g'; }

          STREAMS=$(aws logs describe-log-streams --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime --descending --limit 4 \
            --query 'logStreams[].logStreamName' --output text)
          # The tail is the point of this workflow, and the read role is on
          # ViewOnlyAccess — which lists and describes but does not read the
          # inside of anything. If `logs:GetLogEvents` is not granted, every
          # stream below is refused. The previous `|| true` swallowed that and
          # the job went green having printed nothing, which reads exactly like
          # an estate with no log output.
          for s in $STREAMS; do
            echo "===== STREAM HEAD: $s ====="
            if EVENTS=$(aws logs get-log-events --log-group-name "$LOG_GROUP" \
                --log-stream-name "$s" --limit 30 --start-from-head \
                --query 'events[].message' --output text 2>&1); then
              printf '%s\n' "$EVENTS" | mask
            else
              echo "::warning::unknown — logs:GetLogEvents did not answer for $s. This is NOT an empty stream; grant logs:GetLogEvents on $LOG_GROUP to the read role if the reason below is AccessDenied."
              printf '%s\n' "$EVENTS" | mask
            fi
          done
